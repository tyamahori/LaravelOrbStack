name: test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - '*'

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Get PHP and Composer versions
        id: php-version
        run: |
          echo "PHP_VERSION=$(jq -r 'first(.require.php | scan("[0-9]+\\.[0-9]+"))' composer.json)" >> "$GITHUB_ENV"
          echo "COMPOSER_VERSION=$(jq -r '.config.composerVersion' composer.json)" >> "$GITHUB_ENV"
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:${{ env.COMPOSER_VERSION }}
      - name: Restore Composer packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-cache-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-cache-${{ runner.os }}-${{ hashFiles('composer.lock') }}
            composer-cache-${{ runner.os }}-
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Save Composer packages
        id: cache-composer
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-cache-${{ runner.os }}-${{ hashFiles('composer.lock') }}

  flyio-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Apache
            dockerfile: .docker/php.apache.Dockerfile
          - runtime: FrankenPHP
            dockerfile: .docker/php.franken.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Get PHP and Composer versions
        run: |
          {
            echo "PHP_VERSION=$(jq -r 'first(.require.php | scan("[0-9]+\\.[0-9]+"))' composer.json)"
            echo "COMPOSER_VERSION=$(jq -r '.config.composerVersion' composer.json)"
          } >> "$GITHUB_ENV"
      - name: Build ${{ matrix.runtime }} flyio target
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          docker build \
            --file "$DOCKERFILE" \
            --target flyio \
            --build-arg PHP_VERSION="$PHP_VERSION" \
            --build-arg COMPOSER_VERSION="$COMPOSER_VERSION" \
            --build-arg USER_ID=1000 \
            --build-arg GROUP_ID=1000 \
            --build-arg USER_NAME=laravel \
            .

  lint:
    runs-on: ubuntu-26.04-arm
    needs: cache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore Composer packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-cache-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-cache-${{ runner.os }}-${{ hashFiles('composer.lock') }}
            composer-cache-${{ runner.os }}-
      - name: Get PHP and Composer versions
        id: php-version
        run: |
          echo "PHP_VERSION=$(jq -r 'first(.require.php | scan("[0-9]+\\.[0-9]+"))' composer.json)" >> "$GITHUB_ENV"
          echo "COMPOSER_VERSION=$(jq -r '.config.composerVersion' composer.json)" >> "$GITHUB_ENV"
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:${{ env.COMPOSER_VERSION }}
      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress
      - name: Composer audit
        run: |
          composer audit --locked
      - name: PSR-4 autoload
        run: |
          composer psrCheck
      - name: Package structure
        run: |
          composer structureCheck
      - name: Restore Rector cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tempCache/.rector
          key: rector-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            rector-cache-${{ runner.os }}-${{ github.run_id }}
            rector-cache-${{ runner.os }}-
      - name: Rector
        run: |
          composer rectorCheck
      - name: Cache .rector
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .tempCache/.rector
          key: rector-cache-${{ runner.os }}-${{ github.run_id }}
      - name: Restore Stan cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tempCache/.stan
          key: stan-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            stan-cache-${{ runner.os }}-${{ github.run_id }}
            stan-cache-${{ runner.os }}-
      - name: Stan
        run: |
          composer stanCheck
      - name: Cache .stan
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .tempCache/.stan
          key: stan-cache-${{ runner.os }}-${{ github.run_id }}
      - name: Restore Ecs cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tempCache/.ecs
          key: ecs-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ecs-cache-${{ runner.os }}-${{ github.run_id }}
            ecs-cache-${{ runner.os }}-
      - name: Ecs
        run: |
          composer ecsCheck
      - name: Cache .ecs
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .tempCache/.ecs
          key: ecs-cache-${{ runner.os }}-${{ github.run_id }}
      - name: Deptrac
        run: |
          composer deptracCheck
      - name: Mago
        run: |
          composer magoCheck
  static-analysis:
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks が全履歴を走査する
          fetch-depth: 0
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: zizmor
        uses: docker://ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          args: .github/workflows
      - name: hadolint
        uses: docker://hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
        with:
          args: hadolint .docker/php.apache.Dockerfile .docker/php.franken.Dockerfile
      - name: Trivy config
        uses: docker://aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
        with:
          args: config --exit-code 1 --ignorefile libConfig/trivyignore .
      - name: gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        env:
          # Actions はコンテナの HOME を差し替えるので、イメージの safe.directory 設定が効かない
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --redact --verbose .
      - name: SQLFluff
        uses: docker://sqlfluff/sqlfluff:4.4.0@sha256:6a9083e55b1f4ea437636bc8ca7b55aaa0766a3e43a6d3e5b37614cf97e4e6ac
        with:
          args: lint --config libConfig/sqlfluff.cfg database .docker
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - name: Install Markdown linters
        run: npm ci
      - name: Markdown
        run: npm run mdCheck
  test:
    runs-on: ubuntu-26.04-arm
    needs: cache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Restore Composer packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-cache-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-cache-${{ runner.os }}-${{ hashFiles('composer.lock') }}
            composer-cache-${{ runner.os }}-
      - name: Get PHP and Composer versions
        id: php-version
        run: |
          echo "PHP_VERSION=$(jq -r 'first(.require.php | scan("[0-9]+\\.[0-9]+"))' composer.json)" >> "$GITHUB_ENV"
          echo "COMPOSER_VERSION=$(jq -r '.config.composerVersion' composer.json)" >> "$GITHUB_ENV"
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:${{ env.COMPOSER_VERSION }}
          coverage: xdebug
      - name: Setup
        run: |
          bash -c "set -a; source .docker/local/php/.env.ci; set +a; docker compose -f .docker/compose.yaml -f .docker/compose.ci.yaml --profile '*' down --remove-orphans"
          bash -c "set -a; source .docker/local/php/.env.ci; set +a; docker compose -f .docker/compose.yaml -f .docker/compose.ci.yaml --profile 'app' --profile '' up -d"
          bash -c "set -a; source .docker/local/php/.env.ci; set +a; docker compose -f .docker/compose.yaml -f .docker/compose.ci.yaml run --rm setUpStorage"
      - name: Install psqldef
        run: |
          version=$(sed -n 's#.*/psqldef@v\([0-9.]*\).*#\1#p' .docker/php.apache.Dockerfile)
          curl -fsSL "https://github.com/sqldef/sqldef/releases/download/v${version}/psqldef_linux_arm64.tar.gz" | sudo tar -xz -C /usr/local/bin psqldef
      - name: Install dependencies
        run: |
          bash -c "
          set -a;
          source .docker/local/php/.env.ci;
          set +a;
          composer install --prefer-dist --no-progress;
          php artisan optimize:clear;
          composer schema:apply;
          php artisan db:seed;
          composer ide-helper;
          php -v;
          php artisan -V;
          whoami;
          pwd;
          "
      - name: test
        run: |
          bash -c '
          set -a;
          source .docker/local/php/.env.ci;
          set +a;
          composer phpunit
          '
  e2e:
    # Docker Engine on Linux, the non-OrbStack path: Taskfile's compose.desktop.yaml (Traefik)
    # with the certificate, /etc/hosts entries and CA trust from .docker/proxy/setup.sh.
    runs-on: ubuntu-26.04-arm
    env:
      COMPOSE_FILE: .docker/compose.yaml:.docker/compose.desktop.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Get PHP, Composer and user
        run: |
          {
            echo "PHP_VERSION=$(jq -r 'first(.require.php | scan("[0-9]+\\.[0-9]+"))' composer.json)"
            echo "COMPOSER_VERSION=$(jq -r '.config.composerVersion' composer.json)"
            echo "USER_ID=$(id -u)"
            echo "GROUP_ID=$(id -g)"
            echo "USER_NAME=$(id -un)"
            echo "LARAVELORBSTACK_UID=$(id -u)"
            echo "LARAVELORBSTACK_GID=$(id -g)"
          } >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Apache image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: .docker/php.apache.Dockerfile
          target: local
          tags: laravelorbstack/php:apache-local
          load: true
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            COMPOSER_VERSION=${{ env.COMPOSER_VERSION }}
            USER_ID=${{ env.USER_ID }}
            GROUP_ID=${{ env.GROUP_ID }}
            USER_NAME=${{ env.USER_NAME }}
          cache-from: type=gha,scope=e2e-apache
          cache-to: type=gha,scope=e2e-apache,mode=max
      - name: Build FrankenPHP image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: .docker/php.franken.Dockerfile
          target: local
          tags: laravelorbstack/php:franken-local
          load: true
          build-args: |
            PHP_VERSION=${{ env.PHP_VERSION }}
            COMPOSER_VERSION=${{ env.COMPOSER_VERSION }}
            USER_ID=${{ env.USER_ID }}
            GROUP_ID=${{ env.GROUP_ID }}
            USER_NAME=${{ env.USER_NAME }}
          cache-from: type=gha,scope=e2e-franken
          cache-to: type=gha,scope=e2e-franken,mode=max
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          # This job writes the image build cache (cache-to above), so it restores no npm cache.
          package-manager-cache: false
      - name: Install Playwright and Chromium
        # libnss3-tools gives setup.sh certutil, which puts the CA where Chromium on Linux looks.
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium
          sudo apt-get install -y --no-install-recommends libnss3-tools
      - name: Issue the certificate and map the .local domains to Traefik
        run: .docker/proxy/setup.sh
      - name: Start the app profile
        # vendor/ and the schema come first, so neither PHP server ever boots without them.
        run: |
          docker compose run --rm setUpStorage
          docker compose run --rm php-cli sh -c 'composer install --prefer-dist --no-progress && composer schema:apply && php artisan db:seed'
          docker compose --profile app up -d --wait
      - name: E2E
        run: tests/e2e.sh
      - name: Browser E2E
        run: npm run e2eBrowser
      - name: Container logs
        if: failure()
        run: docker compose --profile '*' logs
