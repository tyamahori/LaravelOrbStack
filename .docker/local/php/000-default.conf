ServerName php-app
<VirtualHost *:80>
    ServerAdmin webmaster@php-app
    DocumentRoot /var/www/html/public
    # IDE は PHP_IDE_CONFIG がないと SERVER_NAME(nginx 経由では laravelorbstack.apache.local)でサーバー定義を探す。
    # CLI と同じ定義 laravelorbstack を使わせ、パス対応付けを一つにする。
    SetEnv PHP_IDE_CONFIG serverName=laravelorbstack
        <Directory /var/www/html/public>
            AllowOverride All
            Options -Indexes +FollowSymLinks
            Require all granted
        </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
