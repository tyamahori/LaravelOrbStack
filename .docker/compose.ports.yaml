# Docker Desktop and Docker Engine on Linux do not read the dev.orbstack.domains label,
# so the *.local domains reach the balancer through the host's loopback port 80 instead,
# with /etc/hosts mapping them to 127.0.0.1 (README「アクセス先」). Taskfile adds this file
# whenever the engine is not OrbStack; OrbStack keeps the port free for other projects.
name: laravelorbstack
services:
  balancer:
    ports:
      - target: 80
        host_ip: 127.0.0.1
        published: "80"
        protocol: tcp
