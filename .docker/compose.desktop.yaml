x-proxy-state: &proxy-state ${XDG_STATE_HOME:-${HOME}/.local/state}/laravelorbstack-proxy

# Docker Desktop and Docker Engine on Linux have no OrbStack domain proxy, so Traefik takes
# its place on 127.0.0.1:80/443/5432 with the certificate .docker/proxy/setup.sh issues, and
# /etc/hosts points the names at 127.0.0.1. Taskfile adds this file whenever the engine is not
# OrbStack.
name: laravelorbstack

services:
  balancer:
    labels:
      traefik.enable: "true"
      traefik.http.routers.app.rule: Host(`apachephp.local`) || Host(`frankenphp.local`)
      traefik.http.services.app.loadbalancer.server.port: "80"

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    # This service is the narrow-allowlist proxy itself; only it touches the socket, read-only.
    volumes:
      - type: bind
        source: /var/run/docker.sock # nosemgrep: compose-docker-socket-mount
        target: /var/run/docker.sock # nosemgrep: compose-docker-socket-mount
        read_only: true
    environment:
      # Default-deny API proxy: Traefik needs container discovery, networks,
      # event watching, ping, and version lookup; POST remains forbidden.
      CONTAINERS: "1"
      EVENTS: "1"
      NETWORKS: "1"
      PING: "1"
      POST: "0"
      VERSION: "1"
    networks:
      docker-api: {}
    command:
      - |
        sed 's/$${BIND_CONFIG}/:2375/g' /usr/local/etc/haproxy/haproxy.cfg.template > /run/haproxy.cfg
        exec haproxy -W -db -f /run/haproxy.cfg
    # The image entrypoint writes beside its read-only template; render only
    # the generated config into the existing writable runtime directory.
    entrypoint:
      - /bin/sh
      - -ec
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:2375/_ping
      interval: 5s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    profiles:
      - app
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run

  mail:
    labels:
      traefik.enable: "true"
      traefik.http.routers.mail.rule: Host(`mail.laravelorbstack.local`)
      traefik.http.services.mail.loadbalancer.server.port: "8025"

  # GUI clients: host postgresql.laravelorbstack.local, port 5432, sslmode=require (SNI is mandatory).
  postgresql:
    labels:
      traefik.enable: "true"
      traefik.tcp.routers.postgresql.rule: HostSNI(`postgresql.laravelorbstack.local`)
      traefik.tcp.routers.postgresql.entrypoints: postgres
      traefik.tcp.routers.postgresql.tls: "true"
      traefik.tcp.services.postgresql.loadbalancer.server.port: "5432"

  storage:
    labels:
      traefik.enable: "true"
      traefik.http.routers.storage.rule: Host(`storage.laravelorbstack.local`)
      traefik.http.services.storage.loadbalancer.server.port: "9000"

  traefik:
    image: traefik:v3.7.15@sha256:0f6150202bc1fed72a7bd2107460eaa510e5b8a905f3fdb5b84f2c8619c33368
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./proxy/tls.yaml
        target: /etc/traefik/dynamic/tls.yaml
        read_only: true
      # create_host_path: false fails `up` until setup.sh has run, instead of Docker
      # creating an empty directory where the certificate should be.
      - type: bind
        source: *proxy-state
        target: /etc/traefik/certs
        read_only: true
        bind:
          create_host_path: false
    ports:
      - target: 80
        host_ip: 127.0.0.1
        published: "80"
        protocol: tcp
      - target: 443
        host_ip: 127.0.0.1
        published: "443"
        protocol: tcp
      - target: 5432
        host_ip: 127.0.0.1
        published: "5432"
        protocol: tcp
    networks:
      default: {}
      docker-api: {}
    command:
      - --api=false
      - --api.dashboard=false
      # Plain HTTP stays open next to HTTPS, as on OrbStack, so the same URLs work on both.
      - --entrypoints.web.address=:80
      - --entrypoints.web.asdefault=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.asdefault=true
      - --entrypoints.websecure.http.tls=true
      # PostgreSQL STARTTLS: Traefik answers SSLRequest and routes by SNI.
      - --entrypoints.postgres.address=:5432
      - --ping=true
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=laravelorbstack_default
      - --providers.file.filename=/etc/traefik/dynamic/tls.yaml
    healthcheck:
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
      interval: 5s
      timeout: 3s
      retries: 5
    # The key in the state directory is readable only by the user who ran setup.sh.
    user: ${LARAVELORBSTACK_UID:?run through task, or export LARAVELORBSTACK_UID=$(id -u)}:${LARAVELORBSTACK_GID:?run through task, or export LARAVELORBSTACK_GID=$(id -g)}
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    profiles:
      - app
    read_only: true
    security_opt:
      - no-new-privileges:true

networks:
  # Socket API access remains reachable only from Traefik.
  docker-api:
    internal: true
