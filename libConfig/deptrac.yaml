deptrac:
  cache_file: .tempCache/.deptrac.cache
  paths:
    - ../packages
  exclude_files:
    - '#(?i)(?:^|/)tests?(?:/|$)#'
  layers:
    # packages/<Feature>/<Layer>/ — see AGENTS.md. A class placed directly under the feature
    # namespace lands in Unplaced, which may depend on nothing, so its first dependency fails.
    - name: Unplaced
      collectors:
        - type: classLike
          value: ^LaravelOrbStack\\[^\\]+\\[^\\]+$
    - name: Domain
      collectors:
        - type: classLike
          value: ^LaravelOrbStack\\[^\\]+\\Domain\\
    - name: UseCase
      collectors:
        - type: classLike
          value: ^LaravelOrbStack\\[^\\]+\\UseCase\\
    # Http/ and Console/ are the same layer: entry points that call UseCases. They stay
    # separate directories only so a class's transport is visible from its path.
    - name: Presentation
      collectors:
        - type: classLike
          value: ^LaravelOrbStack\\[^\\]+\\Http\\
        - type: classLike
          value: ^LaravelOrbStack\\[^\\]+\\Console\\
    - name: Persistence
      collectors:
        - type: classLike
          value: ^LaravelOrbStack\\[^\\]+\\Persistence\\
    - name: Wiring
      collectors:
        - type: classLike
          value: ^LaravelOrbStack\\[^\\]+\\Provider\\
    - name: Framework
      collectors:
        - type: classLike
          value: ^(Illuminate|Symfony|Carbon|Laravel|Database)\\
        - type: classLike
          value: ^PDO
    # Everything else (PSR interfaces, other vendor packages). Kept separate from Framework
    # so Domain/UseCase can use psr/clock without being allowed Illuminate.
    - name: Vendor
      collectors:
        - type: classLike
          value: ^(?!(LaravelOrbStack|Illuminate|Symfony|Carbon|Laravel|Database)\\)(?!PDO)[A-Za-z_]
  ruleset:
    Unplaced: []
    Domain:
      - Vendor
    UseCase:
      - Domain
      - Vendor
    Presentation:
      - UseCase
      - Domain
      - Framework
      - Vendor
    Persistence:
      - Domain
      - Framework
      - Vendor
    Wiring:
      - Domain
      - UseCase
      - Presentation
      - Persistence
      - Framework
      - Vendor
    Framework:
      - Framework
      - Vendor
    Vendor:
      - Vendor
