deptrac:
  cache_file: .tempCache/.deptrac.cache
  paths:
    - ../packages
    - ../app
  exclude_files:
    - '#(?i)(?:^|/)tests?(?:/|$)#'
  layers:
    - name: Controller
      collectors:
        - type: classLike
          value: ^(LaravelOrbStack|App)\\.*Controller.*
    - name: Repository
      collectors:
        - type: classLike
          value: ^(LaravelOrbStack|App)\\.*Repository.*
    - name: Service
      collectors:
        - type: classLike
          value: ^(LaravelOrbStack|App)\\.*Service.*
  ruleset:
    Controller:
      - Service
    Service:
      - Repository
    Repository:
