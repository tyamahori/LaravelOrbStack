deptrac:
  paths:
    - ../packages
    - ../app
  exclude_files:
    - '#.*test.*#'
  layers:
    - name: Controller
      collectors:
        - type: classLike
          value: ^(LaravelOrbStack|App)\\.*Controller.*
    - name: Repository
      collectors:
        - type: classLike
          value: ^(LaravelOrbStack|App)\\.*Repository.*
    - name: Service
      collectors:
        - type: classLike
          value: ^(LaravelOrbStack|App)\\.*Service.*
  ruleset:
    Controller:
      - Service
    Service:
      - Repository
    Repository:
